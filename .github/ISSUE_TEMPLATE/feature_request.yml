name: Feature request
description: Suggest a reusable improvement for the template.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests should benefit a broad range of academic homepage users rather than one personal site.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and discussions for a similar request.
          required: true
        - label: This request is reusable and does not depend on personal content.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What template use case is difficult or unsupported today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and public configuration, if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add mockups, examples, or accessibility considerations. Do not include personal data.
