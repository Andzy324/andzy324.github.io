name: Bug report
description: Report a reproducible problem with the template.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the template. Please remove personal or sensitive information before submitting.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I reproduced the issue with the current `main` branch.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear, concise description of the issue.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Share the smallest set of steps, content changes, or repository needed to reproduce the issue.
      placeholder: |
        1. Install dependencies with ...
        2. Change ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.22.0"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment context
      options:
        - Local development
        - Root-path deployment
        - GitHub Pages project path
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste concise logs or attach screenshots. Do not include secrets or personal data.
      render: shell
