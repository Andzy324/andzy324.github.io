<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Highlight-aware video captioning with reinforcement learning</title>
  <desc id="desc">Video and query pass through a video language model. Temporal alignment, language fidelity, and brevity rewards guide GRPO training toward concise captions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#54708c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="600" rx="36" fill="#f7fafc"/>
  <rect x="34" y="96" width="290" height="206" rx="28" fill="#e8f1fa" stroke="#c2d8eb" stroke-width="3"/>
  <rect x="67" y="136" width="68" height="93" rx="10" fill="#8db8d9"/>
  <rect x="145" y="136" width="68" height="93" rx="10" fill="#6d9fc5"/>
  <rect x="223" y="136" width="68" height="93" rx="10" fill="#4d82ae"/>
  <text x="179" y="278" text-anchor="middle" fill="#24445f" font-family="Arial,sans-serif" font-size="42" font-weight="700">Video + query</text>
  <path d="M332 198h80" stroke="#54708c" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="420" y="96" width="348" height="206" rx="28" fill="#edf0fa" stroke="#c8d2ec" stroke-width="3"/>
  <circle cx="594" cy="168" r="47" fill="#a5a8dd"/>
  <path d="M574 168h40m-20-20v40" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <text x="594" y="278" text-anchor="middle" fill="#343d70" font-family="Arial,sans-serif" font-size="48" font-weight="700">Video model</text>
  <path d="M775 198h80" stroke="#54708c" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="864" y="96" width="302" height="206" rx="28" fill="#e7f4ef" stroke="#b9dfce" stroke-width="3"/>
  <path d="M926 160h180m-180 24h140m-140 24h165" stroke="#6daa91" stroke-width="14" stroke-linecap="round"/>
  <text x="1015" y="278" text-anchor="middle" fill="#2c6854" font-family="Arial,sans-serif" font-size="48" font-weight="700">Caption</text>
  <rect x="154" y="386" width="892" height="155" rx="28" fill="#fff4dc" stroke="#eed69e" stroke-width="3"/>
  <text x="600" y="446" text-anchor="middle" fill="#6c552a" font-family="Arial,sans-serif" font-size="43" font-weight="700">Reward-guided GRPO</text>
  <text x="600" y="507" text-anchor="middle" fill="#806839" font-family="Arial,sans-serif" font-size="32">Temporal alignment  ·  Fidelity  ·  Brevity</text>
  <path d="M594 380v-60" stroke="#a8843e" stroke-width="6" marker-end="url(#arrow)"/>
</svg>
