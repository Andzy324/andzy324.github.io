<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitor globe</title>
  <style>body{margin:0;overflow:hidden;text-align:center}.mmvst_inner{display:block!important}.mmvst_map{cursor:grab;touch-action:none}.mmvst_map:active{cursor:grabbing}</style>
</head>
<body>
  <script id="mmvst_globe" src="https://mapmyvisitors.com/globe.js?d=ANJjnmIh8SVGUbaZgnsMoENE2_k5Tvlh6dDPcSVGNRc"></script>
  <script>
    const observer = new MutationObserver(() => {
      const map = document.querySelector(".mmvst_map");
      const front = document.querySelector(".mmvst_map_f");
      const back = document.querySelector(".mmvst_map_b");
      const dots = document.querySelector(".mmvst_dots");
      if (!map || !front || !back || !dots) return;
      observer.disconnect();
      document.getElementById("mmvst_a")?.removeAttribute("href");

      let startX = 0;
      let startOffset = 0;
      let dragging = false;
      let stopped = false;
      const width = () => map.clientWidth * 2.25;
      const offset = () => new DOMMatrixReadOnly(getComputedStyle(front).transform).m41;
      const rotate = (value) => {
        const span = width();
        const x = ((value % span) + span) % span - span;
        front.style.transform = `translateX(${x}px)`;
        dots.style.transform = `translateX(${x}px)`;
        back.style.transform = `translateX(${x + span}px)`;
      };
      map.addEventListener("pointerdown", (event) => {
        if (!stopped && window.globe_jq) {
          window.globe_jq([front, back, dots]).velocity("stop", true);
          stopped = true;
        }
        startOffset = offset();
        startX = event.clientX;
        dragging = true;
        map.setPointerCapture(event.pointerId);
        event.preventDefault();
      });
      map.addEventListener("pointermove", (event) => {
        if (dragging) rotate(startOffset + event.clientX - startX);
      });
      map.addEventListener("pointerup", () => { dragging = false; });
      map.addEventListener("pointercancel", () => { dragging = false; });
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
